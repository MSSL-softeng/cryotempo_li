# Cryo-TEMPO Baseline-D001 settings 

project: cryotempo
theme: landice  # CryoTEMPO theme: landice, seaice, polaroceans, coastaloceans,inlandwaters
baseline: F  # CryoTEMPO product baseline to produce: A..Z
version: 13   # CryoTEMPO product version to produce: 1..100
#l1b_base_dir: ${CPDATA_DIR}/SATS/RA/CRY/L1B 
l1b_base_dir: ${L1B_BASE_DIR} # should contain LRM,SIN/<YYYY>/<MM>/

l1b_baselines: E   # ESA L1b baseline to select when finding L1b files
# CryoTEMPO product base dir which will contain 
# /<baseline>/<version:03>/LAND_ICE/<ANTARC,GREENL>/<YYYY>/<MM>/
#product_base_dir: /raid6/cryo-tempo/product_baselines
product_base_dir: ${CT_PRODUCT_BASEDIR}

# Set breakpoint file directory
breakpoint_files:
  default_dir: /tmp

# Default locations for log files
log_files:
  append_year_month_to_logname: true  # if chain is run for specific month and year, use <logtype>_MMYYYY.log
                                   # or <logtype>_YYYY.log (if only year specified) 
  errors: ${CT_LOG_DIR}/errors.log  # or errors_MMYYYY.log
  info:   ${CT_LOG_DIR}/info.log
  debug:  ${CT_LOG_DIR}/debug.log

# CS2 instrument parameters
instrument:
  wavelength: 0.022084
  baseline: 1.1676
  # The '+' in the exponential format below is ABSOLUTELY required, or will be seen as a str
  chirp_slope: 7.142857E+12
  num_range_bins_lrm: 128
  ref_bin_index_lrm: 64
  range_bin_size_lrm: 0.468425715625  # c/(2*chirp_bandwidth), in meters
  across_track_beam_width_lrm: 15000 # approx, meters
  along_track_beam_width_lrm: 15000 # approx, meters
  pulse_limited_footprint_size_lrm: 1600 # meters

# Calibration parameters derived by experiment
calibration:
  inferred_angle_cal_mult: 1.02775
  inferred_angle_cal_add: 0.0

# Waveform Quality Tests
lrm_waveform_quality_tests:
  low_peakiness_threshold: 0.85
  high_peakiness_threshold: 3.0
  total_power_threshold: 3e-16

sin_waveform_quality_tests:
  low_peakiness_threshold: 0.9
  total_power_threshold: 5e-17
  low_position_max_power: 2
  high_position_max_power: 1011

# Retracker Thresholds
# TCOG Retracker
tcog_retracker:
  retrack_threshold_lrm: 0.1 # Note was 0.2 in Baseline-B
  retrack_threshold_sin: 0.5
  ref_bin_ind_lrm: 64
  ref_bin_ind_sin: 512
  noise_sample_limit: 6
  savitsky_golay_width: 9
  savitsky_golay_poly_order: 3
  wf_oversampling_factor: 100
  noise_threshold: 0.3
  le_id_threshold: 0.05
  le_dp_threshold: 0.4
  show_plots: false

# Maximum Coherence Retracker
mc_retracker:
  ref_bin_ind_sin: 512
  noise_sample_limit: 6
  savitsky_golay_width: 9
  savitsky_golay_poly_order: 3
  wf_oversampling_factor: 100
  noise_threshold: 0.3
  le_id_threshold: 0.05
  le_dp_threshold: 0.2
  coherence_smoothing_width: 9 
  show_plots: false

# Backscatter
backscatter:
  sigma_bias_lrm: 3.45         
  sigma_bias_sin: 7.23   

# Geolocation
sin_geolocation:
  # Flag heights out of these bounds as bad
  height_min: -2000.0
  height_max: 10000.0
  # Phase method: 1 = least_squares; 2 = curve_fit; 3 = sample window
  phase_method: 3
  # Window centred on retrack location
  phase_window_width: 10
  # If do_three True then do two additional fits, seeded with non-zero phase slope
  do_three: True
  # These parameters are for the sample window method only
  # If mask is True, mask out coherence values lower than the threshold
  mask: False
  mask_coh_ths: 0.7
  # How to sample the window:
  #   max = take the phase at maximum coherence
  #   interp = linear interpolate phase from the two bins bounding the retrack point
  #   Default in the average of these is to take the mean of the non-masked values.
  window_method: "max"
  # If True, geolocate using computed phase and unwrapped phase and keep the better
  # solution (as determined by delta from a DEM)
  unwrap: True
  
  # Minimum deviation of the PRIMARY solution from the DEM, in metres, before any
  # alternative 2pi solution is allowed to replace it. An alternative is used only where
  #     |primary height - DEM| >= unwrap_trigger_m   AND   the alternative is closer.
  #
  # 0 (the baselines B to F010 value) means alternatives are always considered, even for
  # a primary that already agrees with the DEM to within a metre, so a good solution can
  # be flipped by DEM noise.
  #
  # Setting this to 50 would confine replacement to records that already fail the
  # downstream height_filters.max_diff_to_ref_dem_sin (50m) check and would therefore be
  # discarded anyway, making the ambiguity search a pure rescue mechanism that cannot
  # disturb records that are already good. That is the main guard against spurious
  # replacement - note that unwrap_max_dem_diff_m below does NOT serve that purpose,
  # because a spurious solution wins precisely by being CLOSE to the DEM.
  unwrap_trigger_m: 0

  # ------------------------------------------------------------------------------------
  # Baseline-F evolution 3: search multiple 2pi phase ambiguities.
  #
  # The SARIn phase is only known modulo 2pi. One 2pi is 1.114 deg of look angle, ie
  # ~14.5km across track and 120-700m in height, so the candidate POCAs are well
  # separated and the 1km DEM used here discriminates them easily.
  #
  # 0 = baselines B to F010 behaviour: ONE alternative, at -2pi or +2pi chosen by the
  #     sign of the phase. Because angle = -phase*wavelength/(2pi*baseline), that
  #     alternative always lands on the far side of nadir, so the band further out on
  #     the SAME side was never tested.
  # N = test bands -N..+N, ie both neighbours when N=1.
  #
  # Cost: alg_geolocate_sin is already the slowest algorithm in the chain, and
  # angle_to_poca runs per record per candidate, so N=1 roughly doubles it.
  # ------------------------------------------------------------------------------------
  unwrap_ambiguities: 1

  # Reject a measurement (lat, lon and height all set to NaN) if even its BEST candidate
  # is further than this from the DEM. Applies to every record, including those that kept
  # the primary solution, not only those the ambiguity search changed. 0 disables.
  #
  # This does NOT protect against a spurious ambiguity being chosen: a spurious solution
  # wins precisely because its deviation is SMALL, so it passes any threshold set here.
  # What it catches is the case where NO candidate matched the DEM - and the downstream
  # height_filters.max_diff_to_ref_dem_sin (50m) already removes those from the product,
  # against a near-identical 1km DEM. So above ~50m this is largely redundant; below 50m
  # it is stricter than the product filter and would discard records F010 would keep.
  # Use unwrap_trigger_m above to guard against spurious replacement.
  #
  # Left disabled here so F013 isolates the effect of the wider search alone.
  unwrap_max_dem_diff_m: 0

lrm_roemer_geolocation:
  # Configuration for the LRM Roemer correction method (based on Roemer al, 2007)
  #
  # Method to use
  dual_search: True # find approx POCA in BLF closest to satellite, then use finer grid
  use_sliding_window: False # searches for approx POCA using sliding PLF (slower) 
  #
  # DEM selection
  antarctic_dem: rema_gapless_100m_zarr   # Dem class name to use for finding approx POCA over AIS
  antarctic_dem_fine: rema_gapless_100m_zarr  # Dem class for final POCA. Can be the same as antarctic_dem
  greenland_dem: arcticdem_100m_greenland_v4.1_zarr # Dem class name to use for finding approx POCA over GIS
  greenland_dem_fine: arcticdem_100m_greenland_v4.1_zarr # Dem class for final POCA. Can be the same as greenland_dem
  fine_grid_sampling: 10  # sampling rate, when doing re-sampling of _fine DEM for PLF
  median_filter: False # Apply 3x3 median filter to BLF DEM segments extracted around each nadir point
  reject_outside_range_window: True 
  range_window_lower_trim: 0 # m trimmed from start of range window for slope rejection
  range_window_upper_trim: 0 # m trimmed from end of range window for slope rejection

  # dh/dt correction
  include_dhdt_correction: False
  dhdt_grn_name: grn_is2_is1_smith # if include_dhdt_correction, dh/dt dataset name for GIS
  dhdt_ant_name: ais_is2_is1_smith # if include_dhdt_correction, dh/dt dataset name for AIS

  # Tuning
  max_poca_reloc_distance: 6600 # reject points relocated further than this distance (m) from nadir

  # Additional height corrections
  include_slope_doppler_correction: True

reference_dem:
  antarctic_dem: rema_ant_1km_v2_zarr   # Dem class name to use for reference parameter
  greenland_dem: arcticdem_1km_greenland_v4.1_zarr  # Dem class name to use for reference parameter
  # antarctic_dem: rema_gapless_100m_zarr   # Dem class name to use for reference parameter
  # greenland_dem: "arcticdem_100m_greenland_v4.1_zarr"  # Dem class name to use for reference parameter

height_filters:
  # maximum difference to the reference dem elevation in m
  max_diff_to_ref_dem_sin: 50
  max_diff_to_ref_dem_lrm: 30
  max_elevation_antarctica: 4900
  min_elevation_antarctica: -500
  max_elevation_greenland: 3900
  min_elevation_greenland: -500

# Geophysical parameters
geophysical:
  earth_semi_major: 6378137.0
  eccentricity: 0.08181919078479198
  speed_light: 299792458.0

product_output:
  include_additional_parameters: False

#-------------------------------------------------------------------------------------
# Resource Locators
#-------------------------------------------------------------------------------------

surface_type_masks:
  antarctica_bedmachine_v2_grid_mask: ${CPDATA_DIR}/RESOURCES/surface_discrimination_masks/antarctica/bedmachine_v2/BedMachineAntarctica_2020-07-15_v02.nc
  greenland_bedmachine_v3_grid_mask:  ${CPDATA_DIR}/RESOURCES/surface_discrimination_masks/greenland/bedmachine_v3/BedMachineGreenland-2017-09-20.nc
  antarctica_iceandland_dilated_10km_grid_mask:  ${CPDATA_DIR}/RESOURCES/surface_discrimination_masks/antarctica/bedmachine_v2/ant_dilated_grid_mask.nc
  greenland_iceandland_dilated_10km_grid_mask:   ${CPDATA_DIR}/RESOURCES/surface_discrimination_masks/greenland/bedmachine_v3/grn_dilated_grid_mask.nc

basin_masks:
  antarctic_grounded_and_floating_2km_grid_mask: ${CPOM_SOFTWARE_DIR}/cpom/resources/drainage_basins/antarctica/zwally_2012_imbie1_ant_grounded_and_floating_icesheet_basins/basins/zwally_2012_imbie1_ant_grounded_and_floating_icesheet_basins_2km.nc
  greenland_icesheet_2km_grid_mask:  ${CPOM_SOFTWARE_DIR}/cpom/resources/drainage_basins/greenland/zwally_2012_grn_icesheet_basins/basins/Zwally_GIS_basins_2km.nc
  antarctic_icesheet_2km_grid_mask_rignot2016: ${CPOM_SOFTWARE_DIR}/cpom/resources/drainage_basins/antarctica/rignot_2016_imbie2_ant_grounded_icesheet_basins/basins/rignot_2016_imbie2_ant_grounded_icesheet_basins_2km.nc
  greenland_icesheet_2km_grid_mask_rignot2016: ${CPOM_SOFTWARE_DIR}/cpom/resources/drainage_basins/greenland/GRE_Basins_IMBIE2_v1.3/basins/rignot_2016_imbie2_grn_grounded_icesheet_basins_2km.nc
  greenland_icesheet_2km_grid_mask_mouginot2019: ${CPOM_SOFTWARE_DIR}/cpom/resources/drainage_basins/greenland/Mouginot/mouginot_2019_grn_grounded_icesheet_basins_2km.nc

tides:
  fes2014b_base_dir: ${FES2014B_BASE_DIR} # set to base dir of FES2014 (containing LRM,SIN/<YYYY>/<MM>/CS*.fes2014b.nc)
  cats2008a_base_dir: ${CATS2008A_BASE_DIR} # set to base dir of CATS2008a (containing <YYYY>/<MM>/CS*_cats2008a_tides.nc)
  # ------------------------------------------------------------------------------------
  # FES2022 (baseline-F onwards), used by alg_fes2022_tide_correction. Replaces the
  # FES2014b files (fes2014b_base_dir, above) used in baselines B-E.
  # Still pre-computed, by clev2er.tools.compute_fes2022_tides: reading the FES2022
  # model costs ~110s, which cannot be amortised in the chain because run_chain.py
  # spawns one process per L1b file. The pre-processor reads it once per run.
  # ------------------------------------------------------------------------------------
  fes2022_base_dir: ${FES2022_BASE_DIR} # base dir containing LRM,SIN/<YYYY>/<MM>/CS*.fes2022.nc
  # ------------------------------------------------------------------------------------
  # CATS2023 (baseline-F onwards), used by alg_cats2023_tide_correction.
  # Replaces the pre-computed CATS2008a files (cats2008a_base_dir, above) used in
  # baselines B-E: the tide is now computed on the fly from the pyTMD tide model.
  # ------------------------------------------------------------------------------------
  pytmd_tide_models_dir: ${PYTMD_TIDE_MODELS_DIR} # dir containing CATS2008_v2023/CATS2008_v2023.nc
  cats2023_model_name: CATS2008-v2023 # pyTMD model name
  # spline|linear|nearest. The B-E pre-processor used pyTMD's 'spline', but pyTMD calls
  # RectBivariateSpline with kx=ky=1, ie degree-1 == linear. Measured over 11142 points
  # across the Antarctic margin, 'linear' is bit-identical to 'spline' (same values, same
  # validity mask) and 3.6x faster (7.5s vs 27s per file), so 'linear' is used here.
  # 'bilinear' is not usable: it hits a NaN-to-int error in pyTMD 2.2.9 OTIS.
  cats2023_interp_method: linear
  cats2023_extrapolate: false # nearest-neighbour extrapolation beyond the model grid
  cats2023_cutoff_km: 10.0 # extrapolation cutoff (km), only used if extrapolate is true
  cats2023_apply_flexure: true # apply the CATS2023 ice shelf flexure scaling

dem_dirs:
  rema_ant_1km: ${CPDATA_DIR}/SATS/RA/DEMS/rema_1km_dem
  arcticdem_1km: ${CPDATA_DIR}/SATS/RA/DEMS/arctic_dem_1km

uncertainty_tables:
  # 3D/4D elevation-uncertainty LUT NetCDFs, generated from CryoTEMPO-minus-ICESat-2
  # elevation differences by create_cryotempo_luts_from_is2_diffs (CLEV2ER repository).
  # SIN uses a 4D LUT (slope, roughness, power, coherence); LRM a 3D LUT (no coherence).
  # 'covariates' selects which LUT axes are used; unused axes are marginalised at load.
  base_dir: ${CS2_UNCERTAINTY_BASE_DIR}/data/uncertainty_tables/E001
  antarctica:
    sin:
      filename: ant_uncertainty_4d_sin_v01.nc
      covariates: slope,roughness,power,coherence
    lrm:
      filename: ant_uncertainty_3d_lrm_v01.nc
      covariates: slope,roughness,power
  greenland:
    sin:
      filename: grn_uncertainty_4d_sin_v01.nc
      covariates: slope,roughness,power,coherence
    lrm:
      filename: grn_uncertainty_3d_lrm_v01.nc
      covariates: slope,roughness,power

# Slope/roughness rastermaps used as uncertainty-LUT covariates (the same REMA v2 /
# ArcticDEM v4.1 100m SVD 9x9 datasets used to train the LUTs, as in CLEV2ER landice).
# raster_map_name entries are defined in clev2er.utils.raster_maps.raster_map_definitions;
# each directory must hold <default_filename>.zarr plus its _flipped.zarr companion.
surface_slopes:
  antarctica:
    raster_map_name: rema_filled_100m_slope_svd_9x9_zarr
    directory: ${TESTDATA_EXTERNAL_DIR}/adf/landice/slope_data/antarctica
  greenland:
    raster_map_name: arcticdem_cropped_100m_slope_svd_9x9
    directory: ${TESTDATA_EXTERNAL_DIR}/adf/landice/slope_data/greenland

surface_roughness:
  antarctica:
    raster_map_name: rema_filled_100m_roughness_range_svd_9x9_zarr
    directory: ${TESTDATA_EXTERNAL_DIR}/adf/landice/roughness_data/antarctica
  greenland:
    raster_map_name: arcticdem_cropped_100m_roughness_range_svd_9x9_zarr
    directory: ${TESTDATA_EXTERNAL_DIR}/adf/landice/roughness_data/greenland

leap_seconds: ${CPOM_SOFTWARE_DIR}/cpom/resources/leap_seconds/leap-seconds.list

dhdt_data_dir: 
  grn_2010_2021: ${CPDATA_DIR}/RESOURCES/dhdt_data
  
  
